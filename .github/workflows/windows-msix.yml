name: 🪟 Build Windows MSIX (AppX)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.4)'
        required: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_stable: ${{ steps.version.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="v$(node -p "require('./aartiq-browser/package.json').version")"
          fi
          
          VERSION="${TAG#v}"
          
          if [[ "$TAG" == *"-"* ]]; then
            IS_STABLE="false"
          else
            IS_STABLE="true"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_stable=$IS_STABLE" >> $GITHUB_OUTPUT

  build-windows-msix:
    name: Build Windows MSIX
    needs: get-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: aartiq-browser/package-lock.json

      - name: Remove package-lock.json (Windows)
        working-directory: aartiq-browser
        run: if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
        shell: pwsh

      - name: Install Dependencies
        working-directory: aartiq-browser
        run: npm install --legacy-peer-deps

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: aartiq-browser/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('aartiq-browser/package-lock.json') }}

      - name: Inject Microsoft Store Identities
        shell: pwsh
        working-directory: aartiq-browser
        env:
          PKG_NAME: ${{ secrets.STORE_PACKAGE_NAME }}
          PKG_PUB: ${{ secrets.STORE_PUBLISHER_ID }}
          PKG_PUB_DISPLAY: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $jsonPath = "package.json"
          $json = Get-Content $jsonPath -Raw | ConvertFrom-Json

          if ($env:PKG_NAME) {
            $json.build.appx.identityName = $env:PKG_NAME
            Write-Host "Set identityName: $env:PKG_NAME"
          }
          if ($env:PKG_PUB) {
            $json.build.appx.publisher = $env:PKG_PUB
            Write-Host "Set publisher: $env:PKG_PUB"
          }
          if ($env:PKG_PUB_DISPLAY) {
            $json.build.appx.publisherDisplayName = $env:PKG_PUB_DISPLAY
            Write-Host "Set publisherDisplayName: $env:PKG_PUB_DISPLAY"
          }

          $json | ConvertTo-Json -Depth 10 | Set-Content $jsonPath
          Write-Host "Successfully injected Store Identities into $jsonPath"

      - name: Generate Self-Signed Cert (if no CSC_LINK)
        shell: pwsh
        working-directory: aartiq-browser
        run: |
          if ("${{ secrets.CSC_LINK }}" -ne "") {
            Write-Host "CSC_LINK secret found — using provided certificate"
          } else {
            Write-Host "No CSC_LINK secret — generating self-signed development certificate"
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=Latestinssan, O=Latestinssan, C=US" `
              -KeyUsage DigitalSignature `
              -FriendlyName "Aartiq Development Cert" `
              -CertStoreLocation "Cert:\LocalMachine\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

            $pfxPass = [System.Guid]::NewGuid().ToString()
            $securePass = ConvertTo-SecureString -String $pfxPass -Force -AsPlainText

            Export-PfxCertificate -Cert $cert -FilePath "dev-cert.pfx" -Password $securePass
            Export-Certificate -Cert $cert -FilePath "dev-cert.cer"

            # Set env for electron-builder
            echo "CSC_LINK=$((Get-Item 'dev-cert.pfx' | Select-Object -ExpandProperty FullName))" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "CSC_KEY_PASSWORD=$pfxPass" | Out-File -FilePath $env:GITHUB_ENV -Append

            Write-Host "Self-signed certificate created and exported"
          }

      - name: Build MSIX (AppX) Target
        working-directory: aartiq-browser
        env:
          NEXT_PUBLIC_APP_NAME: Aartiq
          NEXT_PUBLIC_APP_VERSION: ${{ needs.get-version.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build && npx electron-builder --win appx --x64

      - name: Rename to MSIX (Optional helper)
        working-directory: aartiq-browser/release
        run: |
          Get-ChildItem -Filter *.appx | Rename-Item -NewName { $_.Name -replace '\.appx$','.msix' }
        shell: pwsh
        continue-on-error: true

      - name: Upload MSIX + Dev Cert
        shell: pwsh
        working-directory: aartiq-browser
        run: |
          New-Item -ItemType Directory -Force -Path _upload
          Copy-Item release/*.msix,release/*.appx,dev-cert.cer -Destination _upload -ErrorAction SilentlyContinue
          Get-ChildItem _upload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aartiq-windows-msix
          path: aartiq-browser/_upload/*

  create-msix-release:
    name: Add MSIX to Release
    needs: [get-version, build-windows-msix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download MSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: aartiq-windows-msix
          path: release-artifacts

      - name: Upload Assets
        run: |
          for file in release-artifacts/*; do
            if [ -f "$file" ]; then
              echo "📤 Uploading: $file"
              gh release upload "${{ needs.get-version.outputs.tag }}" "$file" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
