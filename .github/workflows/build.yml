name: Build All Platforms (Mobile & Desktop)

on:
  workflow_dispatch: {}

jobs:
  build-flutter-browser:
    name: Build Flutter Browser (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        target: [android, ios]
        include:
          - target: android
            os: ubuntu-latest
          - target: ios
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: flutter_browser_app
        run: |
          flutter precache --ios
          flutter pub get

      - name: Build Android APK
        if: matrix.target == 'android'
        working-directory: flutter_browser_app
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4096m"
        run: flutter build apk --release

      - name: Build iOS App
        if: matrix.target == 'ios'
        working-directory: flutter_browser_app
        run: flutter build ios --release --no-codesign

      - name: Upload Flutter Browser Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-browser-${{ matrix.target }}
          path: |
            flutter_browser_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_browser_app/build/ios/iphoneos/Runner.app

  # ============================================================================
  # macOS DMG Builds (arm64 and x64 separately)
  # ============================================================================
  build-macos-arm64:
    name: Build macOS DMG (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: comet-browser/package-lock.json

      - name: Install dependencies
        working-directory: comet-browser
        run: npm install --legacy-peer-deps

      - name: Build macOS ARM64 DMG
        working-directory: comet-browser
        env:
          NEXT_PUBLIC_APP_NAME: Comet
          NEXT_PUBLIC_APP_VERSION: 0.2.9
        run: npm run dist:mac:arm64

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: comet-ai-macos-arm64
          path: comet-browser/release/*.dmg
          retention-days: 30

  build-macos-x64:
    name: Build macOS DMG (Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: comet-browser/package-lock.json

      - name: Install dependencies
        working-directory: comet-browser
        run: npm install --legacy-peer-deps

      - name: Build macOS x64 DMG
        working-directory: comet-browser
        env:
          NEXT_PUBLIC_APP_NAME: Comet
          NEXT_PUBLIC_APP_VERSION: 0.2.9
        run: npm run dist:mac:x64

      - name: Upload macOS x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: comet-ai-macos-x64
          path: comet-browser/release/*.dmg
          retention-days: 30

  build-macos-universal:
    name: Build macOS DMG (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: comet-browser/package-lock.json

      - name: Install dependencies
        working-directory: comet-browser
        run: npm install --legacy-peer-deps

      - name: Build macOS Universal DMG
        working-directory: comet-browser
        env:
          NEXT_PUBLIC_APP_NAME: Comet
          NEXT_PUBLIC_APP_VERSION: 0.2.9
        run: npm run dist:mac:universal

      - name: Upload macOS Universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: comet-ai-macos-universal
          path: comet-browser/release/*.dmg
          retention-days: 30

  # ============================================================================
  # Windows EXE Builds (arm64 and x64 separately)
  # ============================================================================
  build-windows-x64:
    name: Build Windows EXE (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: comet-browser/package-lock.json

      - name: Install dependencies
        working-directory: comet-browser
        run: npm install --legacy-peer-deps

      - name: Build Windows x64 EXE
        working-directory: comet-browser
        env:
          NEXT_PUBLIC_APP_NAME: Comet
          NEXT_PUBLIC_APP_VERSION: 0.2.9
        run: npm run build && npx electron-builder --win --x64 --publish never

      - name: Upload Windows x64 EXE
        uses: actions/upload-artifact@v4
        with:
          name: comet-ai-windows-x64
          path: comet-browser/release/*.exe
          retention-days: 30

  build-windows-arm64:
    name: Build Windows EXE (ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: comet-browser/package-lock.json

      - name: Install dependencies
        working-directory: comet-browser
        run: npm install --legacy-peer-deps

      - name: Build Windows ARM64 EXE
        working-directory: comet-browser
        env:
          NEXT_PUBLIC_APP_NAME: Comet
          NEXT_PUBLIC_APP_VERSION: 0.2.9
        run: npm run build && npx electron-builder --win --arm64 --publish never

      - name: Upload Windows ARM64 EXE
        uses: actions/upload-artifact@v4
        with:
          name: comet-ai-windows-arm64
          path: comet-browser/release/*.exe
          retention-days: 30

  # ============================================================================
  # Linux Build
  # ============================================================================
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: comet-browser/package-lock.json

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libarchive-tools icnsutils libxtst-dev libpng-dev libx11-dev

      - name: Install dependencies
        working-directory: comet-browser
        run: npm install --legacy-peer-deps

      - name: Build Linux AppImage
        working-directory: comet-browser
        env:
          NEXT_PUBLIC_APP_NAME: Comet
          NEXT_PUBLIC_APP_VERSION: 0.2.9
        run: npm run build && npx electron-builder --linux AppImage --x64 --publish never

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: comet-ai-linux-x64
          path: comet-browser/release/*.AppImage
          retention-days: 30